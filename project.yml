name: CodexDictate
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CodexDictate:
    type: application
    platform: macOS
    sources:
      - path: CodexDictate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.CodexDictate
        PRODUCT_NAME: CodexDictate
        INFOPLIST_FILE: CodexDictate/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CodexDictate/Resources/CodexDictate.entitlements
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets:
        - CodexDictateTests
      gatherCoverageData: true
  CodexDictateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodexDictateTests
    dependencies:
      - target: CodexDictate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.CodexDictateTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
